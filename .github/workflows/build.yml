name: Build Android APK

on:
  workflow_dispatch: # 支援手動按按鈕觸發打包

jobs:
  build:
    runs-on: ubuntu-22.04 # 使用穩定的 Linux 環境，避免 Python 3.14 相容性問題

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libstdc++6 cmake sysstat
          pip install --upgrade "buildozer<2.0.0" "cython<3.0.0"

      # 關鍵快取：將 Buildozer 下載的 SDK/NDK 快取起來，下次打包僅需 2 分鐘
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
