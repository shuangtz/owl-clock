name: Build Android APK

on:
  workflow_dispatch: # 允許在 GitHub 網頁手動點擊觸發打包

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Fix Pip
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libstdc++6 cmake sysstat
          # 鎖定 pip 與 setuptools 版本，防止 p4a 崩潰
          pip install --upgrade "pip<24.1" "setuptools<70.0.0" "wheel<0.44.0"
          pip install --upgrade "buildozer<2.0.0" "cython<3.0.0"

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug
        env:
          ACCEPT_BUILD_LICENSES: "y"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
